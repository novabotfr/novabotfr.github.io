<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D0A26">
<title>Avis — Nova</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0D0A26; color: #F5F3FF; font: 16px/1.5 Inter, system-ui, sans-serif; text-align: center; }
  .spin { width: 42px; height: 42px; margin: 0 auto 18px; border: 4px solid #2E2A63; border-top-color: #4FD1FF; border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  a { color: #4FD1FF; }
</style>
</head>
<body>
<div>
  <div class="spin"></div>
  <p>Chargement des avis Nova…</p>
  <p><a id="go" href="#">Clique ici si rien ne se passe</a></p>
</div>
<script src="assets/config.js?v=7"></script>
<script>
  // Les avis sont stockés par le bot : l'adresse se règle dans assets/config.js
  var url = ((window.NOVA && window.NOVA.dashboard) || 'http://51.75.118.151:20107') + '/avis';
  document.getElementById('go').href = url;
  location.replace(url);
</script>
</body>
</html>
