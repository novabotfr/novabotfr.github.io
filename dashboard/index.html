<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0A0F">
<title>Dashboard — Nova</title>
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0A0F; color: #ECEAF4; font: 16px/1.5 Inter, system-ui, sans-serif; text-align: center; }
  .box { padding: 24px; }
  .spin { width: 42px; height: 42px; margin: 0 auto 18px; border: 4px solid #2A2738; border-top-color: #7C5CFF; border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  a { color: #B9A6FF; }
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <p>Redirection vers le dashboard Nova…</p>
  <p><a id="go" href="#">Clique ici si rien ne se passe</a></p>
</div>
<script src="../assets/config.js"></script>
<script>
  // L'adresse du dashboard se règle dans assets/config.js
  var url = ((window.NOVA && window.NOVA.dashboard) || 'http://51.75.118.151:20107') + '/login';
  document.getElementById('go').href = url;
  location.replace(url);
</script>
</body>
</html>
